# Thin-client Hermes deploy (synthetic-data pilot).
#
#   stock Hermes Desktop ──▶ per-user gated backend ──▶ brain over MCP (per-user token)
#                                                   └──▶ LLM over our BYOK gateway (service mode)
#
# This file brings up the SHARED base: control DB, one-shot init+provision, the
# brain API, the BYOK gateway in service mode, and the default-deny egress proxy.
# Per-user pieces (one MCP sidecar + one gated Hermes backend per user) are added
# by provision-user.sh, not here.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose -f deploy/hermes/docker-compose.yml up -d --build
#   ./deploy/hermes/provision-user.sh brindlewood marcus 9131
#
# Secrets come only from .env (never committed). All data is synthetic.
# Project + network names are parameterized by ${DEPLOY_PROJECT} so an isolated copy
# (e.g. the `make e2e` stack, DEPLOY_PROJECT=hermes-e2e) can run beside the normal one
# without clobbering its containers/networks/volumes. Unset -> hermes-deploy, i.e. the
# names are IDENTICAL to before. provision-user.sh/verify-isolation.sh read the same var.
name: ${DEPLOY_PROJECT:-hermes-deploy}

x-admin-env: &admin-env
  ADMIN_DB_USER: ${ADMIN_DB_USER:-brain}
  ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:?set ADMIN_DB_PASSWORD in .env}

networks:
  # Internal, no internet. ONLY the brain and the per-user MCP sidecars join it.
  # No Hermes backend ever joins it, so no Hermes container can reach the brain
  # directly or reach another user's sidecar. (The hole we are closing was one
  # shared network for everything.)
  brain-net:
    name: ${DEPLOY_PROJECT:-hermes-deploy}-brain
    internal: true
  # Containers that must reach the DB or the model provider also join ext.
  # Per-user internal networks (u-<tenant>-<user>) are created by
  # provision-user.sh — each holds exactly one user's Hermes backend + sidecar,
  # with gateway and edge connected in under fixed aliases.
  ext:
    name: ${DEPLOY_PROJECT:-hermes-deploy}-ext

volumes:
  pgdata:

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${ADMIN_DB_USER:-brain}
      POSTGRES_PASSWORD: ${ADMIN_DB_PASSWORD:?set ADMIN_DB_PASSWORD in .env}
      POSTGRES_DB: control
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [ext]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d control"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: create control schema + least-privilege roles (incl. gateway_auth,
  # created because GATEWAY_DB_PASSWORD is set) and provision the brindlewood
  # tenant from the synthetic seed. Idempotent: re-provision is tolerated.
  init:
    build: {context: ../.., dockerfile: backend/Dockerfile, target: production}
    command:
      - sh
      - -c
      - |
        set -e
        python -m app.tenants.admin init
        python -m app.tenants.admin provision --id brindlewood \
          --name "Brindlewood Supply Co." --seed /seed/brindlewood \
          || echo "[init] brindlewood already provisioned — skipping"
    environment:
      <<: *admin-env
      ENV: ${ENV:-development}
      APP_CONTROL_PASSWORD: ${APP_CONTROL_PASSWORD:?set APP_CONTROL_PASSWORD in .env}
      TENANT_DB_KEY: ${TENANT_DB_KEY:?set TENANT_DB_KEY in .env}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?set GATEWAY_DB_PASSWORD in .env}
      # Optional (Phase 2b): set to provision the encrypt-only key-intake DB role at init.
      KEY_INTAKE_DB_PASSWORD: ${KEY_INTAKE_DB_PASSWORD:-}
    volumes:
      - ../../seed:/seed:ro
    networks: [ext]
    depends_on:
      db: {condition: service_healthy}

  brain:
    build: {context: ../.., dockerfile: backend/Dockerfile, target: production}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ENV: ${ENV:-development}
      APP_CONTROL_PASSWORD: ${APP_CONTROL_PASSWORD:?set APP_CONTROL_PASSWORD in .env}
      TENANT_DB_KEY: ${TENANT_DB_KEY:?set TENANT_DB_KEY in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
    networks:
      ext: {}
      brain-net:
        aliases: [brain]        # ONLY the MCP sidecars reach it, at http://brain:8000
    depends_on:
      init: {condition: service_completed_successfully}

  # BYOK gateway, service mode: resolves a per-user token -> tenant/user, injects
  # the TENANT's provider key, enforces the per-tenant model allowlist + caps.
  gateway:
    build: {context: ../.., dockerfile: gateway/Dockerfile}
    environment:
      ENV: ${ENV:-development}
      GATEWAY_AUTH: service
      PORT: "8001"
      LLM_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      GATEWAY_DB_ROLE: gateway_auth
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?set GATEWAY_DB_PASSWORD in .env}
      CONTROL_DB: control
      DB_HOST: db
      TENANT_KEY_KEK: ${TENANT_KEY_KEK:?set TENANT_KEY_KEK in .env}
      # Per-request usage log (gateway/upstream.py:32 _log_usage): one `USAGE caller=<tenant>/<user>
      # … in= out= cache_write= cache_read=` line per upstream call, so the demo can report
      # per-user token usage. Off by default (unset); the demo/CI opt in here.
      GATEWAY_USAGE_LOG: /tmp/usage.log
      # Phase 2b: the PRIVATE half of the keyvault v2 keypair — the gateway decrypts BYOK keys the
      # intake sealed to the public half. Optional (v1/KEK keys don't need it); never on intake.
      KEYVAULT_PRIVATE_KEY: ${KEYVAULT_PRIVATE_KEY:-}
    networks:
      ext: {}                   # DB + model-provider egress. provision-user.sh
                                # connects it to each u-<tenant>-<user> net with
                                # alias brain-gateway so that user's Hermes reaches it.
    depends_on:
      init: {condition: service_completed_successfully}

  # Phase 2b: encrypt-only BYOK key-entry intake. Behind the `key-intake` compose profile so a
  # plain `up` (and `make demo`) does NOT start it. Bound to LOOPBACK ONLY on the host — the key
  # crosses the wire on POST, so it MUST sit behind a TLS ingress before any non-loopback exposure
  # (see deploy/hermes/KEY_INTAKE.md). Holds ONLY the keyvault PUBLIC key + the least-privilege
  # key_intake DB role: it cannot decrypt any tenant key.
  key-intake:
    profiles: ["key-intake"]
    build: {context: ../.., dockerfile: gateway/Dockerfile}
    command: ["uvicorn", "key_intake:app", "--host", "0.0.0.0", "--port", "8099"]
    environment:
      CONTROL_DB: control
      DB_HOST: db
      KEY_INTAKE_DB_ROLE: key_intake
      # Optional at parse time (so a profile-off `up`/`make demo` never fails to interpolate); the
      # service needs BOTH set to run — start it with: docker compose --profile key-intake up -d.
      KEY_INTAKE_DB_PASSWORD: ${KEY_INTAKE_DB_PASSWORD:-}
      KEYVAULT_PUBLIC_KEY: ${KEYVAULT_PUBLIC_KEY:-}
      KEY_INTAKE_BASE_URL: ${KEY_INTAKE_BASE_URL:-http://127.0.0.1:8099}
    ports:
      - "127.0.0.1:8099:8099"   # LOOPBACK ONLY — never 0.0.0.0 without TLS in front
    networks:
      ext: {}                   # reach the control DB + the provider endpoint for validation
    depends_on:
      init: {condition: service_completed_successfully}

  # Default-deny egress proxy. User backends route all HTTP(S) through it; with
  # EGRESS_ALLOW empty every CONNECT is refused, so a user backend can reach only
  # the brain + gateway (direct, via no_proxy) and nothing on the internet.
  edge:
    image: python:3.12-slim
    command: ["python", "/opt/egress_proxy.py"]
    environment:
      EGRESS_ALLOW: ${EGRESS_ALLOW:-}   # empty = deny-all (the pilot default)
      EGRESS_PORT: "3128"
    volumes:
      - ./gated/egress_proxy.py:/opt/egress_proxy.py:ro
    networks:
      ext: {}                   # provision-user.sh connects it to each
                                # u-<tenant>-<user> net with alias edge.
