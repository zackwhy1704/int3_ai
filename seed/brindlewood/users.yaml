# Brindlewood Supply Co. is a fictional company. Every person, document and
# number in this seed is invented for the demo.

users:
  - id: priya
    email: priya@brindlewood.example
    name: Priya N.
    title: Head of Operations
  - id: marcus
    email: marcus@brindlewood.example
    name: Marcus O.
    title: Finance Director
  - id: ada
    email: ada@brindlewood.example
    name: Ada L.
    title: CEO

scopes:
  - id: company-wide
    name: Company-wide
    kind: everyone
    description: Policies, pricing, process. The answers customer-facing staff quote every day.
    owner: ada
  - id: operations
    name: Operations
    kind: department
    description: Runbooks, supplier terms, incident history for the operations team.
    # Proposer != approver by design: priya (Head of Operations, the sole member)
    # PROPOSES operations facts; ada (CEO) OWNS the scope and APPROVES them. This is
    # the demo's two-person capture gate, and it comes straight from the seed so a
    # fresh bring-up has it with no hand edits.
    owner: ada
  - id: finance
    name: Finance
    kind: department
    description: Budgets, payment terms, commercial approvals.
    owner: marcus
  - id: leadership
    name: Leadership
    kind: restricted
    description: Board and strategy material.
    owner: ada

memberships:
  priya: [company-wide, operations]
  marcus: [company-wide, finance]
  # ada owns operations (approves its captures) so she must also be a member of it
  # — the owner sees proposals and their conflicting claims, which are scope content.
  ada: [company-wide, leadership, operations]
