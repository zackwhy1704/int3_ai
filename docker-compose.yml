services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: brain
      POSTGRES_DB: brain
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d brain"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://brain:brain@db:5432/brain
      SEED_DIR: /seed
      # Dev: any Bearer token resolves to BRAIN_DEV_USER. Remove for production.
      # Production: set BRAIN_AUTH=oidc, OIDC_AUDIENCE=<google_client_id>, remove BRAIN_DEV_USER.
      BRAIN_DEV_USER: priya
      # BRAIN_AUTH: oidc          # uncomment for production
      # OIDC_AUDIENCE: ""         # set to your Google OAuth2 Client ID
    volumes:
      - ./seed:/seed:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Model gateway — OpenAI-compatible LLM proxy.
  # Holds the Anthropic API key server-side. Desktop and web clients never see it.
  # Gate 2: GATEWAY_AUTH=none (dev only — remove before Gate 4).
  # Gate 4: set GATEWAY_AUTH=oidc and OIDC_AUDIENCE=<google_client_id>.
  gateway:
    build: ./gateway
    env_file:
      - path: .env
        required: false
    environment:
      GATEWAY_AUTH: none        # dev only; production: oidc
      PORT: "8001"
      # ANTHROPIC_API_KEY comes from .env (required in production)
      # OIDC_AUDIENCE: ""       # set to Google OAuth2 Client ID for production
    ports:
      - "8001:8001"

  web:
    build: ./web
    environment:
      API_URL: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
