services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: brain
      POSTGRES_DB: brain
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d brain"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://brain:brain@db:5432/brain
      SEED_DIR: /seed
      # Gate 3 dev mode: any Bearer token on /v1/ resolves to this user.
      # Gate 4: remove BRAIN_DEV_USER and implement RS256 OIDC token verification.
      BRAIN_DEV_USER: priya
    volumes:
      - ./seed:/seed:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Model gateway — OpenAI-compatible LLM proxy.
  # Holds the Anthropic API key server-side. Desktop and web clients never see it.
  # Gate 2: GATEWAY_AUTH=none (dev only — remove before Gate 4).
  # Gate 4: set GATEWAY_AUTH=oidc and OIDC_AUDIENCE=<google_client_id>.
  gateway:
    build: ./gateway
    env_file:
      - path: .env
        required: false
    environment:
      GATEWAY_AUTH: none        # dev only — see gateway/auth.py
      PORT: "8001"
      # ANTHROPIC_API_KEY comes from .env (required in production)
    ports:
      - "8001:8001"

  web:
    build: ./web
    environment:
      API_URL: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
