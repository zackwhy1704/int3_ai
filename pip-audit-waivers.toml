# pip-audit waivers — packages with known advisories that cannot be upgraded
# because an upstream dependency pins them below the fix version.
#
# To audit with waivers: pip-audit -r <file> --ignore-vuln <id> ...
# CI uses this file to skip known-waived IDs.

# --- starlette ---
# fastapi 0.115.14 (latest 0.115.x) requires starlette>=0.40.0,<0.47.0.
# The starlette advisories below require >=0.47.2 / >=0.49.1 / >=1.0.1 / >=1.1.0 / >=1.3.0 / >=1.3.1.
# Upgrading fastapi past 0.132.x to drop the <0.47 cap is a major version jump
# that changes APIs (adds opentelemetry-api, annotated-doc as required deps,
# drops starlette upper bound). Accepting until the project migrates to fastapi >=0.134.

[[waivers]]
id = "PYSEC-2026-1941"
package = "starlette"
reason = "fastapi 0.115.x pins starlette<0.47; fix requires >=0.47.2; upgrade to fastapi>=0.134 planned"

[[waivers]]
id = "PYSEC-2026-1942"
package = "starlette"
reason = "fastapi 0.115.x pins starlette<0.47; fix requires >=0.49.1; upgrade to fastapi>=0.134 planned"

