# pip-audit waivers — packages with known advisories that cannot be upgraded
# because an upstream dependency pins them below the fix version.
#
# To audit with waivers: pip-audit -r <file> --ignore-vuln <id> ...
# CI uses this file to skip known-waived IDs.

# --- starlette ---
# REMOVED: fastapi 0.142.x resolves starlette>=1.7.0 (patched). No waivers needed.

# --- pillow ---
# fastembed 0.4.2 requires pillow<11.0.0,>=10.3.0.
# The pillow advisories below require >=12.1.1 / >=12.2.0 / >=12.3.0.
# Text-only models (bge-small, ms-marco-MiniLM); no image decode path reachable.
# fastembed upgrade requires re-running app.calibrate and supersede_eval.

[[waivers]]
id = "PYSEC-2026-2249"
package = "pillow"
reason = "text-only models (bge-small, ms-marco-MiniLM); no image decode path reachable. fastembed upgrade requires re-running app.calibrate and supersede_eval."

